# Three grids in one process. Spacing per coin from research/2026-09-30-grid-coin-compare.md:
# wider spacing for more volatile coins. All grids share the USDT in the account pool.
# An open grid is resumed with the parameters it was created with; these values apply
# only when a grid is created.

[runtime]
ledger_path = "data/gridbot.sqlite"
log_dir = "data/logs"
reconcile_interval_s = 3600
snapshot_interval_s = 300

[[grids]]
inst_id = "BTC-USDT"
capital_quote = 100
spacing_pct = 1.0
levels_below = 8
levels_above = 8
seed_slippage_pct = 0.1

[[grids]]
inst_id = "ETH-USDT"
capital_quote = 100
spacing_pct = 2.0
levels_below = 8
levels_above = 8
seed_slippage_pct = 0.1

[[grids]]
inst_id = "SOL-USDT"
capital_quote = 100
spacing_pct = 2.0
levels_below = 8
levels_above = 8
seed_slippage_pct = 0.1
