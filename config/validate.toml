# Validation grids: small capital, dense spacing, to exercise code paths on each coin.
# The BTC grid was created 2026-09-30 with these values and is resumed as is.
[runtime]
ledger_path = "data/gridbot.sqlite"
log_dir = "data/logs"
reconcile_interval_s = 3600
snapshot_interval_s = 300

[[grids]]
inst_id = "BTC-USDT"
capital_quote = 50
spacing_pct = 0.3
levels_below = 10
levels_above = 10
seed_slippage_pct = 0.1

